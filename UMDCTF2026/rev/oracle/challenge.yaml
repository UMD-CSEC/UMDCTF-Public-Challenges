name: oracle
author: segal

description: |-
  this just in. an undisclosed prediction market exchange abruptly went dark last night after a leaked memo suggested they'd been resolving markets before the outcomes happened. regulators were left dumbfounded. an intern mailed you a copy of `oracle`, the internal binary the trading floor used to release settlements, along with a staging blob. allegedly one unpublished market was still sitting in the queue when the lights went off: a wager on your team's performance. of course the resolution is already signed. produce a ticket the oracle accepts and read what the market would rather you didn't.

flag: UMDCTF{oh_no_my_prediction_market_feed_has_been_compromised_what_ever_will_i_do}

provide:
  - dist/oracle
  - dist/feed.bin

visible: true
